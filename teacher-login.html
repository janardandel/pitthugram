<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login — Pitthugram</title>
    <link rel="icon" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<header class="navbar">
    <div class="container nav-inner">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Pitthugram">
        </a>
        <div class="nav-actions" style="display:flex;">
            <a href="index.html" class="btn btn-outline btn-sm" style="padding:0.5rem 1rem;">
                <i class="ph ph-house"></i> Home
            </a>
        </div>
    </div>
</header>

<!-- Login -->
<div class="login-page">
    <div class="login-card">

        <a href="index.html" class="login-logo">
            <img src="logo.png" alt="Pitthugram">
        </a>

        <div class="login-head">
            <div class="icon-wrap">
                <i class="ph-fill ph-chalkboard-teacher"></i>
            </div>
            <h1>Teacher Portal</h1>
            <p>Sign in to schedule MCQ tests for your students</p>
        </div>

        <!-- Alert -->
        <div class="alert-box" id="alertBox">
            <i class="ph-fill ph-warning-circle"></i>
            <span id="alertMsg"></span>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <i class="ph ph-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <i class="ph ph-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="toggle-pw" id="togglePw">
                        <i class="ph ph-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="loginText">Sign In</span>
                <i class="ph ph-arrow-right" id="loginArrow"></i>
            </button>
            <div id="standaloneSpinner" style="display:none;width:24px;height:24px;border:2px solid rgba(244,0,9,0.25);border-top-color:#f40009;border-radius:50%;animation:spin 0.7s linear infinite;margin:.75rem auto 0;"></div>
        </form>

        <div class="login-footer-note">
            Having trouble? <a href="mailto:support@pitthugram.com">Contact Support</a>
        </div>

    </div>
</div>

<script>
const SUPABASE_URL = 'https://qnqcysdeolnooxxcafwz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OpibBhZoOKk2iCZ3pEfZsg_vUm_77vF';

if (localStorage.getItem('pg_access_token')) {
    window.location.href = 'quiz-builder.html';
}

document.getElementById('togglePw').addEventListener('click', function() {
    const inp  = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'ph ph-eye-slash';
    } else {
        inp.type = 'password';
        icon.className = 'ph ph-eye';
    }
});

function showAlert(msg, type) {
    const box = document.getElementById('alertBox');
    const txt = document.getElementById('alertMsg');
    box.className = 'alert-box alert-' + type;
    txt.textContent = msg;
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    document.getElementById('alertBox').className = 'alert-box';
    document.getElementById('loginBtn').style.display = 'none';
    document.getElementById('standaloneSpinner').style.display = 'block';

    try {
        const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'apikey': SUPABASE_KEY,
                'Authorization': 'Bearer ' + SUPABASE_KEY
            },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
            throw new Error(data.error_description || data.msg || 'Invalid email or password.');
        }

        localStorage.setItem('pg_access_token',  data.access_token);
        localStorage.setItem('pg_refresh_token', data.refresh_token);
        localStorage.setItem('pg_user', JSON.stringify(data.user));

        document.getElementById('standaloneSpinner').style.display = 'none';
        showAlert('Login successful! Redirecting...', 'success');

        setTimeout(() => { window.location.href = 'quiz-builder.html'; }, 800);

    } catch (err) {
        document.getElementById('standaloneSpinner').style.display = 'none';
        document.getElementById('loginBtn').style.display = 'flex';
        showAlert(err.message || 'Something went wrong. Please try again.', 'error');
    }
});
</script>
</body>
</html>
